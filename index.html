/* ---------- ART PROVIDERS ---------- */
/* Each provider resolves {img,src,ex?,t?} or null. Providers run in priority order;
   first usable image wins, but metadata (extract/platforms/ratings) merges from whichever provider has it. */
const norm=s=>s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const EDITIONS=['definitive edition','game of the year edition','directors cut','enhanced edition','remastered','remaster','remake','redux','goty'];
function splitEdition(s){s=norm(s);for(const e of EDITIONS){const en=norm(e);if(s===en||s.endsWith(' '+en))return{base:s.slice(0,s.length-en.length).trim()||s,ed:en}}return{base:s,ed:null}}
function titleSim(a,b){const A=splitEdition(a),B=splitEdition(b);a=A.base;b=B.base;if(!a||!b)return 0;
 let score;if(a===b)score=1;
 else{const aw=a.split(' '),bw=new Set(b.split(' '));let hit=0;aw.forEach(w=>{if(bw.has(w))hit++});
  const cov=hit/aw.length;score=b.startsWith(a)||a.startsWith(b)?Math.max(cov,.75):cov}
 return A.ed===B.ed?score:score*.3}

async function fetchJSON(url,opts){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),9000);
 try{const r=await fetch(url,{...opts,signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(tm)}}

async function provWiki(g){
 const q=`${g.n}${g.y?' '+g.y:''} video game`;
 const r=await fetchJSON('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=6&gsrsearch='+encodeURIComponent(q)+'&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=440&exintro=1&explaintext=1&exsentences=3&exlimit=max');
 const pages=Object.values(r.query?.pages||{});if(!pages.length)return null;
 let best=null,bestScore=0;
 for(const p of pages){const cleanTitle=p.title.replace(/\s*\([^)]*\)\s*$/,'');let sc=titleSim(g.n,cleanTitle);
  if(p.thumbnail)sc+=.1;if(sc>bestScore){bestScore=sc;best=p}}
 if(!best||bestScore<.45)return null;
 return{img:best.thumbnail?.source||'',src:'Wikipedia',ex:best.extract||'',t:best.title}}

async function provSteam(g){
 const r=await fetchJSON('https://store.steampowered.com/api/storesearch/?term='+encodeURIComponent(g.n)+'&l=english&cc=US');
 const items=r.items||[];if(!items.length)return null;
 let best=null,bestScore=0;
 for(const it of items){const sc=titleSim(g.n,it.name);if(sc>bestScore){bestScore=sc;best=it}}
 if(!best||bestScore<.5)return null;
 return{img:best.tiny_image?.replace('capsule_sm_120','library_600x900')||best.tiny_image||'',src:'Steam',appid:best.id}}

async function job(g){
 const active=PROVIDERS.filter(([name])=>!(name==='sgdb'&&!SGDB_KEY)&&!(name==='rawg'&&!RAWG_KEY));
 const settled=await Promise.allSettled(active.map(([,fn])=>fn(g)));
 let picked=null,meta={};
 active.forEach(([name],idx)=>{
  const r=settled[idx];
  if(r.status==='rejected'){PROV_STATE[name]='err';console.warn('[backlog] provider',name,'failed for',g.n,r.reason?.message);return}
  const res=r.value;if(!res)return;
  PROV_STATE[name]='ok';
  if(res.ex)meta.ex=meta.ex||res.ex;if(res.t)meta.t=meta.t||res.t;
  if(res.mc!=null)meta.mc=res.mc;if(res.rt!=null)meta.rt=res.rt;if(res.pl)meta.pl=res.pl;
  if(!picked&&res.img&&isHttpUrl(res.img))picked={img:res.img,src:res.src}
 });
 if(picked)ART[g.k]={...picked,...meta};
 else if(Object.keys(meta).length)ART[g.k]={...(ART[g.k]||{}),...meta};
 if(meta.mc!=null||meta.rt!=null||meta.pl){RAW[g.k]={...(RAW[g.k]||{}),mc:meta.mc??RAW[g.k]?.mc,rt:meta.rt??RAW[g.k]?.rt,pl:meta.pl??RAW[g.k]?.pl}}
 g._failed=!picked;g.q=picked?2:0;g._retry=false;
 refreshCardArt(g);
 updateProvDots();
 if(++dirty%6===0){SV('ba_art',ART);SV('ba_rawg',RAW)}
}

/* ---------- AI (OpenAI-compatible chat completions; works with OpenRouter, Groq, Gemini, local Ollama, etc.) ---------- */
const AI_DEFAULT_URL='https://openrouter.ai/api/v1/chat/completions',AI_DEFAULT_MODEL='deepseek/deepseek-chat-v3.1:free';
let AI_URL=LS('ba_ai_url',AI_DEFAULT_URL),AI_KEY=LS('ba_ai_key',''),AI_MODEL=LS('ba_ai_model',AI_DEFAULT_MODEL),TAGS=LS('ba_tags',{}),NL_MODE=LS('ba_nlmode',false);
const aiReady=()=>!!(AI_URL&&AI_KEY&&AI_MODEL);
async function aiChat(messages,{json=false,maxTokens=700}={}){
 if(!aiReady())throw new Error('no-key');
 const body={model:AI_MODEL,messages,temperature:.4,max_tokens:maxTokens};
 if(json)body.response_format={type:'json_object'};
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),30000);
 try{
  const r=await fetch(AI_URL,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+AI_KEY},body:JSON.stringify(body)});
  if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('HTTP '+r.status+(t?': '+t.slice(0,160):''))}
  const d=await r.json();
  const content=d.choices?.[0]?.message?.content;
  if(!content)throw new Error('empty response');
  return content
 }finally{clearTimeout(tm)}}
function extractJSON(s){const m=s.match(/\{[\s\S]*\}|\[[\s\S]*\]/);if(!m)throw new Error('no JSON found in AI response');return JSON.parse(m[0])}
function poolBrief(pool){return pool.map(g=>({k:g.k,n:g.n,genre:g.g,year:g.y,hours:g.h,status:st(g),rating:S[g.k]?.r||null,metacritic:RAW[g.k]?.mc||null,tags:TAGS[g.k]||null}))}

async function aiSmartPick(mood){
 const pool=view().filter(g=>['todo','play'].includes(st(g)));
 if(!pool.length)throw new Error('empty-pool');
 const brief=poolBrief(pool).slice(0,400);
 const sys='You pick one game from a JSON list for the user to play next. Consider their mood note, genre variety, unplayed favorites (higher rating/metacritic), and shorter games if time seems tight. Reply with ONLY a JSON object: {"key":"<the k field of your pick>","reason":"<one punchy sentence, max 20 words, in the voice of a noir case-file clerk>"}. The key MUST exactly match a "k" field from the list.';
 const usr=`Mood/context: ${mood||'(none given — just pick something good)'}\n\nCandidates:\n${JSON.stringify(brief)}`;
 const out=await aiChat([{role:'system',content:sys},{role:'user',content:usr}],{json:true,maxTokens:200});
 const parsed=extractJSON(out);
 const g=pool.find(x=>x.k===parsed.key);
 if(!g)throw new Error('model picked an invalid key');
 return{game:g,reason:parsed.reason||''}}

async function aiSearch(query){
 const brief=poolBrief(G).slice(0,500);
 const sys='You search a JSON list of games for ones matching the user\'s natural-language query (mood, length, genre, era, status, whatever they describe). Reply with ONLY a JSON array of matching "k" values, best match first, max 40 items. No other text.';
 const out=await aiChat([{role:'system',content:sys},{role:'user',content:`Query: ${query}\n\nGames:\n${JSON.stringify(brief)}`}],{json:false,maxTokens:500});
 const arr=extractJSON(out);
 if(!Array.isArray(arr))throw new Error('expected array');
 return new Set(arr.filter(k=>typeof k==='string'))}

async function aiTriageBacklog(){
 const pool=G.filter(g=>st(g)==='todo'),capped=pool.slice(0,150),truncated=pool.length>150;
 const brief=poolBrief(capped);
 const sys='You review a JSON list of backlog games and flag ones unlikely to ever be played (very old platform, duplicate of something already completed in the same series, etc). Reply with ONLY a JSON array of {"key":"<k>","reason":"<one short sentence>"}. Only include games you would genuinely recommend abandoning — do not pad the list.';
 const out=await aiChat([{role:'system',content:sys},{role:'user',content:JSON.stringify(brief)}],{json:false,maxTokens:900});
 const arr=extractJSON(out);if(!Array.isArray(arr))throw new Error('expected array');
 const items=arr.filter(x=>x&&typeof x.key==='string').map(x=>({g:pool.find(p=>p.k===x.key),reason:x.reason||''})).filter(x=>x.g);
 return{items,truncated}}

async function aiTag(g){
 const sys='Given one video game, reply with ONLY a JSON array of 3-5 short lowercase mood/theme tags (1-2 words each, e.g. "cozy", "high difficulty", "story-rich", "multiplayer", "short burst"). No other text.';
 const out=await aiChat([{role:'system',content:sys},{role:'user',content:`${g.n}${g.y?' ('+g.y+')':''} — genre: ${g.g}`}],{json:false,maxTokens:80});
 const arr=extractJSON(out);
 if(!Array.isArray(arr))throw new Error('expected array');
 return arr.filter(t=>typeof t==='string').slice(0,5).map(t=>t.toLowerCase().trim())}

 else if(i==='exj'){dl('backlog-progress.json',JSON.stringify(S,null,1),'application/json');toast('Progress exported')}

 else if(i==='triage'){closeDialog($('#cfg'));triageUI()}

$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 if(f.size>8*1024*1024){toast('File too large');e.target.value='';return}
 const t=await f.text();
 if(e.target.dataset.mode==='json'){
  let parsed;try{parsed=JSON.parse(t)}catch{toast('Could not parse JSON');e.target.value='';e.target.dataset.mode='';return}
  if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)){toast('Invalid progress file');e.target.value='';e.target.dataset.mode='';return}
  let bad=null;for(const k in parsed){if(parsed[k]!=null&&(typeof parsed[k]!=='object'||Array.isArray(parsed[k]))){bad=k;break}}
  if(bad!=null){toast(`Invalid entry for key "${bad}" — import cancelled`);e.target.value='';e.target.dataset.mode='';return}
  if(Object.keys(S).length)promptMergeChoice(parsed);else{S=parsed;save();render(1);toast('Progress imported')}
 }
 else load(t);
 e.target.value='';e.target.dataset.mode=''};
function promptMergeChoice(incoming){const d=$('#cfg');
 d.innerHTML=`<div class="pk" style="text-align:left"><button type="button" class="x" id="mcClose">[CLOSE ✕]</button><h3 style="font-size:34px">Import progress</h3><p>You already have saved progress on this device. How should the import be applied?</p>
 <div class="ch" style="margin-top:14px"><button type="button" id="mReplace">[REPLACE ALL]</button><button type="button" id="mMerge">[MERGE — NEWER WINS]</button><button type="button" id="mCancel">[CANCEL]</button></div></div>`;
 if(!d.open)d.showModal();
 d.querySelector('#mcClose').onclick=()=>closeDialog(d);
 d.querySelector('#mReplace').onclick=()=>{S=incoming;save();render(1);closeDialog(d);toast('Progress imported (replaced)')};
 d.querySelector('#mMerge').onclick=()=>{
  const merged={...S};
  for(const k in incoming){const inc=incoming[k],cur=S[k];
   merged[k]=cur?((inc?.ts||0)>=(cur?.ts||0)?inc:cur):inc}
  S=merged;save();render(1);closeDialog(d);toast('Progress merged')};
 d.querySelector('#mCancel').onclick=()=>closeDialog(d)}

 if(e.target.matches('input,textarea')||$('#m').open||$('#cfg').open)return;
 if(e.key==='/'){e.preventDefault();$('#q').focus()}else if(e.key==='r')pick();else if(e.key==='g'){F.group^=1;render(1)}else if(e.key==='t')speedRunUI()});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',async e=>{e.preventDefault();const f=e.dataTransfer.files?.[0];if(f)load(await f.text())});
function load(t){const{games,warnings}=parse(t);G=games;rail();render(1);announce(`Loaded ${G.length} files`);showParseWarnings(warnings)}
function showParseWarnings(warnings){const old=document.getElementById('pwarn');old?.remove();if(!warnings.length)return;
 const b=document.createElement('div');b.id='pwarn';b.style.cssText='background:var(--rd);color:var(--ink);padding:8px 14px;font-size:13px;margin:10px 0;rotate:-.4deg';
 b.innerHTML=`${warnings.length} line${warnings.length===1?'':'s'} in games.md could not be read — <button type="button" id="pwShow" style="text-decoration:underline">[SHOW]</button><button type="button" id="pwDismiss" style="margin-left:10px">[DISMISS]</button><pre id="pwPre" style="display:none;white-space:pre-wrap;margin:8px 0 0;font-size:12px;background:#0002;padding:8px"></pre>`;
 b.querySelector('#pwPre').textContent=warnings.join('\n');
 b.querySelector('#pwShow').onclick=()=>{const p=b.querySelector('#pwPre');p.style.display=p.style.display==='none'?'block':'none'};
 b.querySelector('#pwDismiss').onclick=()=>b.remove();
 $('#out').before(b)}
fetch('games.md',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(load).catch(()=>{$('#out').innerHTML='<div class="empty">THE ARCHIVE (games.md) WON’T OPEN.<br><br><button type="button" id="pickFile2">[CHOOSE games.md]</button> OR DROP IT ON THE DESK.</div>';$('#pickFile2')?.addEventListener('click',()=>$('#file').click())});
</script></body></html>
